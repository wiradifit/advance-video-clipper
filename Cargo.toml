[package]
name = "advance-video-clipper"
version = "0.1.0"
edition = "2021"
authors = ["wiradifit <https://github.com/wiradifit>"]
description = "High-performance AI video clipper for TikTok & YouTube Shorts with Whisper audio sync & Hormozi subtitles"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
regex = "1.10"
colored = "2.1"
indicatif = "0.17"
tempfile = "3.12"
anyhow = "1.0"
thiserror = "1.0"

[[bin]]
name = "advance-clipper"
path = "src/main.rs"
